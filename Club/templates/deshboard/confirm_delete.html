{% extends "navbar.html" %}
{% load static %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}

<style>
/* Container */
.confirm-container {
    max-width: 500px;
    margin: 80px auto;
    background: #fff;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
}

/* Heading */
.confirm-container h1 {
    color: #dc2626;
    font-size: 1.8rem;
    margin-bottom: 15px;
}

/* Message */
.confirm-container p {
    color: #374151;
    font-size: 16px;
    margin-bottom: 25px;
}

/* Buttons */
.btn {
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    text-decoration: none;
    display: inline-block;
    margin: 0 10px;
    cursor: pointer;
    transition: 0.2s;
}

.btn-cancel {
    background: #9ca3af;
    color: white;
}

.btn-cancel:hover {
    background: #6b7280;
}

.btn-confirm {
    background: #dc2626;
    color: white;
}

.btn-confirm:hover {
    background: #b91c1c;
}
</style>

<div class="confirm-container">
    <h1>Are you sure?</h1>
    <p>You are about to delete <strong>{{ object }}</strong>. This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-confirm">Yes, Delete</button>
        <a href="{{ cancel_url }}" class="btn btn-cancel">Cancel</a>
    </form>
</div>

{% endblock %}
