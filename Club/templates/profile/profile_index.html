{% extends "navbar.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}
<style>
/* ===== GLOBAL ===== */
body {
    background: #f8f9fa;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: #111827;
}

/* ===== LAYOUT ===== */
.profile-page {
    max-width: 1200px;
    margin: 3rem auto;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 2rem;
    padding: 0 2rem;
}

/* ===== LEFT SIDEBAR ===== */
.profile-menu {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: sticky;
    top: 2rem;
}

.profile-menu h3 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 1rem;
    border-bottom: 2px solid #4f46e5;
    padding-bottom: 0.5rem;
}

/* Menu Items */
.menu-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-weight: 500;
    font-size: 1rem;
    color: #374151;
    text-decoration: none;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    transition: all 0.2s;
}

.menu-item span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: #4f46e5;
    color: #fff;
    border-radius: 50%;
    font-size: 0.9rem;
}

.menu-item:hover,
.menu-item.active {
    background: #e0e7ff;
    color: #4f46e5;
}

/* ===== RIGHT CONTENT ===== */
.profile-content {
    display: flex;
    flex-direction: column;
    gap: 2rem;
}

/* Section Titles */
.profile-section-title {
    font-size: 1.3rem;
    font-weight: 600;
    color: #111827;
    border-bottom: 1px solid #d1d5db;
    padding-bottom: 0.3rem;
    margin-bottom: 1rem;
}

/* Profile Info Grid */
.profile-info {
    display: grid;
    grid-template-columns: 180px 1fr;
    row-gap: 0.8rem;
    column-gap: 1rem;
}

.profile-info strong {
    font-weight: 600;
    color: #374151;
}

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
}

.skills span {
    border: 1px solid #0369a1;
    color: #0369a1;
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    font-weight: 500;
    font-size: 0.85rem;
}

/* Edit Button */
.edit-btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.6rem 1.4rem;
    border: 2px solid #4f46e5;
    background: white;
    color: #4f46e5;
    border-radius: 6px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
}

.edit-btn:hover {
    background: #4f46e5;
    color: white;
}

/* RESPONSIVE */
@media (max-width: 1024px) {
    .profile-page {
        grid-template-columns: 1fr;
    }

    .profile-menu {
        flex-direction: row;
        overflow-x: auto;
        gap: 0.8rem;
        padding: 1rem 0;
    }

    .menu-item {
        flex: 0 0 auto;
        padding: 0.5rem 0.8rem;
    }
}
</style>

<div class="profile-page">

    <!-- LEFT SIDEBAR -->
    <div class="profile-menu">
        <h3>My Profile</h3>

        <a href="{% url 'personal_information' %}" class="menu-item {% block personal_active %}{% endblock %}">
            <span>👤</span> Personal Info
        </a>

        <a href="{% url 'address_list'%}" class="menu-item {% block address_active %}{% endblock %}">
            <span>📍</span> Address
        </a>

        <a href="" class="menu-item {% block education_active %}{% endblock %}">
            <span>🎓</span> Education
        </a>

        <a href="{% url 'show_skill' %}" class="menu-item {% block skills_active %}{% endblock %}">
            <span>🧠</span> Skills
        </a>

        <a href="{% url 'job_list' %}" class="menu-item {% block job_active %}{% endblock %}">
            <span>💼</span> Job Profile
        </a>

        <a href="{% url 'handles' %}" class="menu-item {% block judge_active %}{% endblock %}">
            <span>🏆</span> Online Judge 3
        </a>

        <a href="" class="menu-item {% block certification_active %}{% endblock %}">
            <span>📜</span> Certifications
        </a>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="profile-content">
        {% block profile_content %}
        {% endblock %}
    </div>

</div>
{% endblock %}
