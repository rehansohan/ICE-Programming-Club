{% extends "navbar.html" %}
{% block title %}Login - ICE Programming Club{% endblock %}

{% block content %}
<style>
/* --------- LOGIN PAGE STYLES --------- */
:root {
    --primary-color: #2563eb;
    --secondary-color: #1d4ed8;
    --radius: 10px;
    --text-color: #1f2937;
}

body {
    background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
}

.auth-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 70px);
    padding: 3rem 1rem;
}

.auth-card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    max-width: 400px;
    width: 100%;
    overflow: hidden;
}

.auth-header {
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: #fff;
    text-align: center;
    padding: 2rem;
}

.auth-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
.auth-header p { font-size: 1rem; opacity: 0.9; }

.auth-body { padding: 2rem; }

.form-group { margin-bottom: 1.5rem; }
.form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-color); }

.form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid #e2e8f0;
    border-radius: var(--radius);
    font-size: 1rem;
    transition: 0.3s;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.input-with-icon { position: relative; }
.input-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
}
.input-with-icon .form-control { padding-left: 3rem; }

.password-toggle {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #64748b;
}

.form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.remember-me { display: flex; align-items: center; gap: 0.5rem; }
.remember-me input { width: 18px; height: 18px; accent-color: var(--primary-color); }
.forgot-link { color: var(--primary-color); text-decoration: none; font-weight: 500; }
.forgot-link:hover { text-decoration: underline; }

.btn-auth {
    width: 100%;
    padding: 0.9rem;
    background: var(--primary-color);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn-auth:hover {
    background: var(--secondary-color);
    transform: translateY(-2px);
}

.auth-footer { text-align: center; margin-top: 1.5rem; }
.auth-footer p { color: #64748b; }
.auth-link { color: var(--primary-color); text-decoration: none; font-weight: 600; }
.auth-link:hover { text-decoration: underline; }

.alert { padding: 1rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.95rem; }
.alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
.alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
</style>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>ICE Programming Club</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="auth-body">

            <!-- Django messages -->
         

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" class="form-control" placeholder="student@university.edu" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember_me"> Remember me
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-auth">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="{% url 'register' %}" class="auth-link">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Toggle password visibility
document.addEventListener('DOMContentLoaded', function() {
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });
});
</script>
{% endblock %}
