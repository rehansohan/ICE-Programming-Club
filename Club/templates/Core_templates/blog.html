<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ICE Programming Club{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #071739;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .hero-section {
            background: linear-gradient(to right, #071739, #0b2d66);
            color: white;
            padding: 80px 0;
        }

        .blog-card {
            transition: 0.3s;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .blog-card:hover {
            transform: translateY(-5px);
        }

        .footer {
            background: #071739;
            color: white;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            ICE Programming Club
        </a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/news/">News & Blogs</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

{% block content %}
{% endblock %}

<div class="footer text-center">
    <p class="mb-0">
        © 2026 ICE Programming Club. All rights reserved.
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
