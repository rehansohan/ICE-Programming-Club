<style>
:root{
    --blue1:#1e88e5;
    --blue2:#1565c0;
    --bg:#f4f6f9;
    --border:#e5e7eb;
    --text:#1f2937;
}

/* ===== RESET ===== */
*{ box-sizing:border-box; margin:0; padding:0; }
body{
    font-family:'Segoe UI',sans-serif;
    background:var(--bg);
    overflow:hidden; /* prevent body scroll */
}

/* ===== NAVBAR ===== */
.navbar{
    height:80px;
    background:linear-gradient(90deg,var(--blue1),var(--blue2));
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:15px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
}
.navbar strong{
    font-size:1.5rem;
}
.menu-btn{
    background:none;
    border:none;
    font-size:1.5rem;
    color:#fff;
    cursor:pointer;
}

/* NAVBAR ACTIONS */
.nav-actions{
    margin-left:auto;
    display:flex;
    gap:10px;
}
.nav-btn{
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
    border:none;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
}
.nav-btn.outline{
    background:transparent;
    border:1px solid rgba(255,255,255,.6);
    color:#fff;
}
.nav-btn.solid{
    background:#fff;
    color:var(--blue2);
}
.nav-btn:hover{ opacity:.9; }

/* ================= FOOTER ================= */
footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:40px;
    background:#263238;
    color:#cfd8dc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    z-index:1000;
}

/* ================= LAYOUT ================= */
.layout{
    display:grid;
    grid-template-columns:260px 1fr;
    height: calc(100vh - 120px); /* full viewport minus navbar + footer */
    margin-top:80px; /* push below navbar */
    transition: grid-template-columns 0.3s ease;
}
.layout.collapsed{
    grid-template-columns:0 1fr;
}

/* ================= SIDEBAR ================= */
.sidebar-left{
    background:#fff;
    border-right:1px solid var(--border);
    height:100%;
    overflow-y:auto; /* independent scroll */
    scrollbar-width:thin;
    scrollbar-color:#cbd5e1 transparent;
}
.sidebar-left::-webkit-scrollbar{
    width:6px;
}
.sidebar-left::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:10px;
}
.nav-item{
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #f1f5f9;
    text-decoration:none;
    color:var(--text);
    font-weight:600;
}
.nav-item:hover, .nav-item.active{
    background:#f5f7fb;
}

/* ================= MAIN CONTENT ================= */
.main-content{
    height:100%;
    overflow-y:auto; /* independent scroll */
    padding:30px;
    scrollbar-width:thin;
}
.main-content::-webkit-scrollbar{
    width:8px;
}
.main-content::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:10px;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
    .layout{
        grid-template-columns:0 1fr;
    }
}
</style>
