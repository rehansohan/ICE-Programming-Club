{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ICE Programming Club - News & Blogs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'blog/css/blog.css' %}">
    {% include 'includes/navbar_head.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    {% include 'includes/navbar_fragment.html' %}

    <main class="container my-4">
      {% block content %}{% endblock %}

    <footer class="bg-light py-4 mt-5">
      <div class="container text-center small">
        <div class="row">
          <div class="col-md-6 text-start">
            <strong>ICE Programming Club</strong><br>
            Stay updated with club activities and technical blogs.
          </div>
          <div class="col-md-6 text-end">
            <a href="#" class="me-2"><i class="fab fa-github"></i></a>
            <a href="#" class="me-2"><i class="fab fa-twitter"></i></a>
            <a href="#" class="me-2"><i class="fab fa-linkedin"></i></a>
          </div>
        </div>
        <div class="mt-3">&copy; ICE Programming Club • All rights reserved.</div>
      </div>
    </footer>

    <script src="{% static 'blog/js/blog.js' %}"></script>
